<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <meta name="description" content="">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-shell nav">
        <a class="brand" id="brand-link" href="#top"></a>
        <nav class="nav-links" id="site-nav" aria-label="Primary navigation"></nav>
      </div>
    </header>

    <main>
      <section class="hero" id="top">
        <div class="hero-copy" id="hero-content"></div>
      </section>

      <section class="section section-white" id="about-snapshot">
        <h2 class="section-title" id="about-title"></h2>
        <div class="grid three site-shell" id="about-list"></div>
      </section>

      <section class="section section-yellow" id="core-skills">
        <h2 class="section-title" id="skills-title"></h2>
        <div class="skill-card" id="skill-list"></div>
      </section>

      <section class="section section-gray" id="featured-projects">
        <div class="section-heading site-shell">
          <h2 class="section-title" id="projects-title"></h2>
          <a class="text-link" id="project-archive-link" href="#project-archive-preview"></a>
        </div>
        <div class="grid three site-shell" id="featured-project-list"></div>
      </section>

      <section class="section section-dark" id="project-archive-preview">
        <h2 class="section-title" id="archive-title"></h2>
        <div class="archive-list site-shell" id="archive-project-list"></div>
      </section>

      <section class="section section-gray" id="experience">
        <h2 class="section-title" id="career-title"></h2>
        <div class="career-timeline site-shell" id="career-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-shell">© <span id="year"></span> <span id="footer-brand"></span></div>
    </footer>

    <script type="module">
      import { careerItems } from '/data/career.js';
      import { homeContent } from '/data/home.js';
      import { profile, profileCards } from '/data/profile.js';
      import { projects } from '/data/projects.js';
      import {
        applyDocumentMeta,
        byId,
        renderArchiveProject,
        renderCareerTimeline,
        renderHero,
        renderNavLinks,
        renderProfileCards,
        renderProjectCard,
        renderSkillGroups,
      } from '/assets/main.js';

      applyDocumentMeta(profile);
      byId('brand-link').textContent = profile.brand;
      byId('footer-brand').textContent = profile.brand;
      byId('site-nav').innerHTML = renderNavLinks(homeContent.nav);
      byId('hero-content').innerHTML = renderHero(homeContent.hero);
      byId('about-title').textContent = homeContent.sections.about.title;
      byId('about-list').innerHTML = renderProfileCards(profileCards);
      byId('skills-title').textContent = homeContent.sections.skills.title;
      byId('skill-list').innerHTML = renderSkillGroups(homeContent.skillGroups);
      byId('projects-title').textContent = homeContent.sections.projects.title;
      byId('project-archive-link').textContent = homeContent.sections.projects.archiveLinkLabel;
      byId('project-archive-link').href = homeContent.sections.projects.archiveLinkHref;
      byId('archive-title').textContent = homeContent.sections.archive.title;
      byId('career-title').textContent = homeContent.sections.career.title;
      byId('career-list').innerHTML = renderCareerTimeline(careerItems);

      byId('featured-project-list').innerHTML = projects
        .filter((project) => project.featured)
        .map((project) => renderProjectCard(project, { detailed: true }))
        .join('');

      byId('archive-project-list').innerHTML = projects
        .filter((project) => !project.featured)
        .slice(0, homeContent.sections.archive.limit)
        .map(renderArchiveProject)
        .join('');

      const navLinks = [...document.querySelectorAll('[data-section-link]')];
      const linkedSections = navLinks
        .map((link) => document.querySelector(link.getAttribute('href')))
        .filter(Boolean);

      const setActiveSection = (id) => {
        navLinks.forEach((link) => {
          if (link.getAttribute('href') === `#${id}`) {
            link.setAttribute('aria-current', 'page');
          } else {
            link.removeAttribute('aria-current');
          }
        });
      };

      navLinks.forEach((link) => {
        link.addEventListener('click', () => setActiveSection(link.getAttribute('href').slice(1)));
      });

      const sectionObserver = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => Math.abs(a.boundingClientRect.top) - Math.abs(b.boundingClientRect.top));

        if (visible[0]) setActiveSection(visible[0].target.id);
      }, {
        rootMargin: '-30% 0px -55% 0px',
        threshold: 0.01,
      });

      linkedSections.forEach((section) => sectionObserver.observe(section));
    </script>
  </body>
</html>
