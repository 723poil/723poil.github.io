<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <meta name="description" content="">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-shell nav">
        <a class="brand" id="brand-link" href="#top"></a>
        <nav class="nav-links" id="site-nav" aria-label="Primary navigation"></nav>
      </div>
    </header>

    <main>
      <section class="hero" id="top">
        <div class="hero-copy" id="hero-content"></div>
      </section>

      <section class="section section-white" id="about-snapshot">
        <h2 class="section-title" id="about-title"></h2>
        <div class="grid three site-shell" id="about-list"></div>
      </section>

      <section class="section section-yellow" id="core-skills">
        <h2 class="section-title" id="skills-title"></h2>
        <div class="skill-card" id="skill-list"></div>
      </section>

      <section class="section section-gray" id="featured-projects">
        <div class="section-heading site-shell">
          <h2 class="section-title" id="projects-title"></h2>
          <div class="project-filter-list" id="project-type-filters"></div>
        </div>
        <div class="grid three site-shell" id="featured-project-list"></div>
        <div class="project-more site-shell" id="additional-projects" hidden>
          <div class="grid three" id="additional-project-list"></div>
        </div>
        <div class="project-actions site-shell">
          <button class="button secondary" id="project-more-button" type="button" aria-expanded="false"></button>
        </div>
      </section>

      <section class="section section-dark" id="project-archive-preview">
        <h2 class="section-title" id="archive-title"></h2>
        <div class="archive-list site-shell" id="archive-project-list"></div>
      </section>

      <section class="section section-gray" id="experience">
        <h2 class="section-title" id="career-title"></h2>
        <div class="career-timeline site-shell" id="career-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-shell">© <span id="year"></span> <span id="footer-brand"></span></div>
    </footer>
    <div class="project-modal" id="project-modal" hidden></div>

    <script type="module">
      import { careerItems } from '/data/career.js?v=20260618-career-periods';
      import { homeContent } from '/data/home.js';
      import { profile, profileCards } from '/data/profile.js';
      import { projects } from '/data/projects.js';
      import { pageContent } from '/data/site.js';
      import {
        applyDocumentMeta,
        byId,
        renderEmptyState,
        renderCareerTimeline,
        renderHero,
        renderNavLinks,
        renderProfileCards,
        renderProjectCard,
        renderProjectModal,
        renderSkillGroups,
      } from '/assets/main.js';

      applyDocumentMeta(profile);
      byId('brand-link').textContent = profile.brand;
      byId('footer-brand').textContent = profile.brand;
      byId('site-nav').innerHTML = renderNavLinks(homeContent.nav);
      byId('hero-content').innerHTML = renderHero(homeContent.hero);
      byId('about-title').textContent = homeContent.sections.about.title;
      byId('about-list').innerHTML = renderProfileCards(profileCards);
      byId('skills-title').textContent = homeContent.sections.skills.title;
      byId('skill-list').innerHTML = renderSkillGroups(homeContent.skillGroups);
      byId('projects-title').textContent = homeContent.sections.projects.title;
      byId('project-type-filters').setAttribute('aria-label', homeContent.sections.projects.filterLabel);
      byId('archive-title').textContent = homeContent.sections.archive.title;
      byId('career-title').textContent = homeContent.sections.career.title;
      byId('career-list').innerHTML = renderCareerTimeline(careerItems, homeContent.sections.career);

      const projectTypes = [...new Set(projects.map((project) => project.type).filter(Boolean))];
      let activeProjectType = projectTypes[0] ?? '';
      let showSecondaryItems = false;
      const projectTypeFilters = byId('project-type-filters');
      const featuredProjectList = byId('featured-project-list');
      const additionalProjectList = byId('additional-project-list');
      const secondaryItemsSection = byId('additional-projects');
      const projectMoreButton = byId('project-more-button');
      const projectModal = byId('project-modal');
      const modalLabels = {
        ...pageContent.projectDetail.sections,
        closeButtonLabel: pageContent.projectDetail.closeButtonLabel,
      };

      const renderProjectTypeFilters = () => {
        projectTypeFilters.innerHTML = '';
        projectTypeFilters.hidden = projectTypes.length === 0;

        projectTypes.forEach((type) => {
          const button = document.createElement('button');
          button.className = 'project-filter-button';
          button.type = 'button';
          button.dataset.projectTypeFilter = type;
          button.setAttribute('aria-pressed', String(type === activeProjectType));
          button.textContent = type;
          projectTypeFilters.append(button);
        });
      };

      const renderFilteredItems = () => {
        const filteredItems = activeProjectType
          ? projects.filter((project) => project.type === activeProjectType)
          : projects;
        const primaryItems = filteredItems.filter((project) => project.featured);
        const secondaryItems = filteredItems.filter((project) => !project.featured);
        const renderProject = (project) => renderProjectCard(project, {
          detailed: true,
          actionMode: 'modal',
          detailLabel: pageContent.projectDetail.detailButtonLabel,
        });

        featuredProjectList.innerHTML = primaryItems.map(renderProject).join('');
        additionalProjectList.innerHTML = secondaryItems.map(renderProject).join('');

        if (secondaryItems.length) {
          projectMoreButton.hidden = false;
          secondaryItemsSection.hidden = !showSecondaryItems;
          projectMoreButton.setAttribute('aria-expanded', String(showSecondaryItems));
          projectMoreButton.textContent = showSecondaryItems
            ? homeContent.sections.projects.lessButtonLabel
            : homeContent.sections.projects.moreButtonLabel;
        } else {
          showSecondaryItems = false;
          secondaryItemsSection.hidden = true;
          projectMoreButton.hidden = true;
          projectMoreButton.setAttribute('aria-expanded', 'false');
        }
      };

      renderProjectTypeFilters();
      renderFilteredItems();

      projectTypeFilters.addEventListener('click', (event) => {
        const filterButton = event.target.closest('[data-project-type-filter]');
        if (!filterButton) return;
        activeProjectType = filterButton.dataset.projectTypeFilter;
        showSecondaryItems = false;
        renderProjectTypeFilters();
        renderFilteredItems();
      });

      projectMoreButton.addEventListener('click', () => {
        showSecondaryItems = !showSecondaryItems;
        renderFilteredItems();
      });

      byId('archive-project-list').innerHTML = homeContent.sections.archive.items.length
        ? homeContent.sections.archive.items.map((item) => renderProjectCard(item)).join('')
        : renderEmptyState(homeContent.sections.archive.emptyMessage);

      const closeProjectModal = () => {
        projectModal.hidden = true;
        projectModal.innerHTML = '';
        document.body.classList.remove('modal-open');
      };

      const openProjectModal = (slug) => {
        const project = projects.find((item) => item.slug === slug);
        if (!project) return;
        projectModal.innerHTML = renderProjectModal(project, modalLabels);
        projectModal.hidden = false;
        document.body.classList.add('modal-open');
        projectModal.querySelector('[data-modal-close]')?.focus();
      };

      document.addEventListener('click', (event) => {
        const careerSkillToggle = event.target.closest('[data-career-skill-toggle]');
        if (careerSkillToggle) {
          const skillCard = byId(careerSkillToggle.getAttribute('aria-controls'));
          if (!skillCard) return;
          const expanded = careerSkillToggle.getAttribute('aria-expanded') === 'true';
          skillCard.classList.toggle('is-collapsed', expanded);
          careerSkillToggle.setAttribute('aria-expanded', String(!expanded));
          careerSkillToggle.textContent = expanded
            ? careerSkillToggle.dataset.expandLabel
            : careerSkillToggle.dataset.collapseLabel;
          return;
        }

        const careerProjectToggle = event.target.closest('[data-career-project-toggle]');
        if (careerProjectToggle) {
          const projectList = byId(careerProjectToggle.getAttribute('aria-controls'));
          if (!projectList) return;
          const expanded = careerProjectToggle.getAttribute('aria-expanded') === 'true';
          projectList.classList.toggle('is-collapsed', expanded);
          careerProjectToggle.setAttribute('aria-expanded', String(!expanded));
          careerProjectToggle.textContent = expanded
            ? careerProjectToggle.dataset.expandLabel
            : careerProjectToggle.dataset.collapseLabel;
          return;
        }

        const detailButton = event.target.closest('[data-project-detail]');
        if (detailButton) {
          openProjectModal(detailButton.dataset.projectDetail);
          return;
        }

        if (event.target.closest('[data-modal-close]')) closeProjectModal();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !projectModal.hidden) closeProjectModal();
      });

      const navLinks = [...document.querySelectorAll('[data-section-link]')];
      const linkedSections = navLinks
        .map((link) => document.querySelector(link.getAttribute('href')))
        .filter(Boolean);

      const setActiveSection = (id) => {
        navLinks.forEach((link) => {
          if (link.getAttribute('href') === `#${id}`) {
            link.setAttribute('aria-current', 'page');
          } else {
            link.removeAttribute('aria-current');
          }
        });
      };

      navLinks.forEach((link) => {
        link.addEventListener('click', () => setActiveSection(link.getAttribute('href').slice(1)));
      });

      const sectionObserver = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => Math.abs(a.boundingClientRect.top) - Math.abs(b.boundingClientRect.top));

        if (visible[0]) setActiveSection(visible[0].target.id);
      }, {
        rootMargin: '-30% 0px -55% 0px',
        threshold: 0.01,
      });

      linkedSections.forEach((section) => sectionObserver.observe(section));
    </script>
  </body>
</html>
